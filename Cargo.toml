[package]
name = "fsearch"
default-run = "fsearch"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage"] }
calamine = "0.37"
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release plus symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = false
