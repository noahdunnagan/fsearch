[package]
name = "fsearch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# File watching on Linux (inotify). macOS uses FSEvents and needs no extra dep.
notify = "8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
