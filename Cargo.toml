[package]
name = "fsearch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
libc = "=0.2.189"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
