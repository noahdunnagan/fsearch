[package]
name = "fsearch"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
parking_lot = "0.12"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
